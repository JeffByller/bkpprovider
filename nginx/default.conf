server {
    listen 80;
    server_name bkp.jeffgsan.com.br;

    # Validação do Certbot / Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona HTTP para HTTPS na porta 4443
    location / {
        return 301 https://$host:4443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bkp.jeffgsan.com.br;

    # Certificado (Se existirem os certificados do Let's Encrypt em /etc/letsencrypt/live/bkp.jeffgsan.com.br, use-os. 
    # Caso contrário, usa os certificados autoassinados da pasta /etc/nginx/ssl)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Para usar o Certbot Let's Encrypt oficial, basta descomentar as duas linhas abaixo e comentar as duas acima:
    # ssl_certificate /etc/letsencrypt/live/bkp.jeffgsan.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bkp.jeffgsan.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://monitor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

