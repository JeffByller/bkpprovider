server {
    listen 80;
    server_name _;

    # Validação do Certbot / Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona HTTP para HTTPS na porta 4443
    location / {
        return 301 https://$host:4443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Certificado SSL (autoassinado ou Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Para usar o Certbot Let's Encrypt oficial, basta descomentar as duas linhas abaixo e comentar as duas acima:
    # ssl_certificate /etc/letsencrypt/live/bkp.jeffgsan.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bkp.jeffgsan.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Hide Nginx version
    server_tokens off;

    location / {
        proxy_pass http://monitor:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}


